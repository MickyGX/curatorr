name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Pinned to 22.x: better-sqlite3 11.x aborts on Node 24 during process
          # teardown (RemoveEnvironmentCleanupHook assertion in Statement::~Statement),
          # which fails the test step even when every assertion passes.
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run optional checks
        run: |
          npm run lint --if-present
          npm run test --if-present
          npm run build --if-present
