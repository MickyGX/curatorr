name: Docker Publish

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  dockerhub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect analyzer changes
        id: analyzer-changes
        shell: bash
        run: |
          set -euo pipefail

          ANALYZER_PATHS=(
            docker/analyzer/Dockerfile
            docker/analyzer/requirements.txt
            scripts/analyzer-sidecar.py
          )

          is_tag_ref=false
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            is_tag_ref=true
          fi

          changed=true
          source_tag=""
          previous_tag=""

          if [[ "${is_tag_ref}" == "true" ]]; then
            current_tag="${GITHUB_REF_NAME}"
            previous_tag="$(git tag --list 'v*.*.*' --sort=-version:refname | grep -Fxv "${current_tag}" | head -n 1 || true)"
            source_tag="${previous_tag}"

            if [[ -n "${previous_tag}" ]]; then
              if git diff --quiet "${previous_tag}" -- "${ANALYZER_PATHS[@]}"; then
                changed=false
              fi
            fi
          else
            base_ref="${{ github.event.before }}"
            if [[ -z "${base_ref}" || "${base_ref}" == "0000000000000000000000000000000000000000" ]]; then
              base_ref="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi

            source_tag="development"

            if [[ -n "${base_ref}" ]]; then
              if git diff --quiet "${base_ref}" -- "${ANALYZER_PATHS[@]}"; then
                changed=false
              fi
            fi
          fi

          {
            echo "changed=${changed}"
            echo "source_tag=${source_tag}"
            echo "previous_tag=${previous_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract app metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mickygx/curatorr
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Extract analyzer metadata
        id: analyzer-meta
        uses: docker/metadata-action@v5
        with:
          images: mickygx/curatorr-analyzer
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'development' }}
          cache-from: type=gha,scope=curatorr-app
          cache-to: type=gha,mode=max,scope=curatorr-app

      - name: Build and push analyzer image
        if: steps.analyzer-changes.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/analyzer/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.analyzer-meta.outputs.tags }}
          labels: ${{ steps.analyzer-meta.outputs.labels }}
          cache-from: type=gha,scope=curatorr-analyzer
          cache-to: type=gha,mode=max,scope=curatorr-analyzer

      - name: Reuse previous analyzer image for release tag
        id: reuse-analyzer
        if: startsWith(github.ref, 'refs/tags/') && steps.analyzer-changes.outputs.changed != 'true' && steps.analyzer-changes.outputs.source_tag != ''
        shell: bash
        run: |
          set -euo pipefail

          tag_args=()
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            tag_args+=(--tag "${tag}")
          done <<< "${{ steps.analyzer-meta.outputs.tags }}"

          if [[ "${#tag_args[@]}" -eq 0 ]]; then
            echo "No analyzer tags were generated."
            exit 1
          fi

          source_tag=""
          while IFS= read -r candidate_tag; do
            [[ -n "${candidate_tag}" ]] || continue
            if docker buildx imagetools inspect "mickygx/curatorr-analyzer:${candidate_tag}" > /dev/null 2>&1; then
              source_tag="${candidate_tag}"
              break
            fi
          done < <(git tag --list 'v*.*.*' --sort=-version:refname | grep -Fxv "${GITHUB_REF_NAME}")

          if [[ -z "${source_tag}" ]]; then
            if docker buildx imagetools inspect "mickygx/curatorr-analyzer:latest" > /dev/null 2>&1; then
              source_tag="latest"
            else
              echo "No reusable analyzer image tag was found on Docker Hub."
              exit 1
            fi
          fi

          source_image="mickygx/curatorr-analyzer:${source_tag}"
          docker buildx imagetools create "${tag_args[@]}" "${source_image}"
          echo "source_tag=${source_tag}" >> "$GITHUB_OUTPUT"

      - name: Summarize analyzer publish strategy
        shell: bash
        run: |
          if [[ "${{ steps.analyzer-changes.outputs.changed }}" == "true" ]]; then
            echo "Analyzer image rebuilt from source changes." >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "${{ steps.reuse-analyzer.outputs.source_tag }}" && "${GITHUB_REF:-}" == refs/tags/* ]]; then
            echo "Analyzer image unchanged; reused mickygx/curatorr-analyzer:${{ steps.reuse-analyzer.outputs.source_tag }} for this release tag." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Analyzer image unchanged; skipped rebuild for this push." >> "$GITHUB_STEP_SUMMARY"
          fi
