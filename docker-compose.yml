services:
  curatorr:
    container_name: curatorr
    image: mickygx/curatorr:latest
    ports:
      - "7676:7676"
    environment:
      - CONFIG_PATH=/app/config/config.json
      - DATA_DIR=/app/data
      - BASE_URL=http://localhost:7676
      - TRUST_PROXY=true
      - TRUST_PROXY_HOPS=1
      # Optional: required for Spotify playlist import and refresh.
      # Add the matching callback URL in your Spotify app settings:
      # http://localhost:7676/user-settings/spotify/callback
      # - SPOTIFY_CLIENT_ID=your-spotify-client-id
      # - SPOTIFY_CLIENT_SECRET=your-spotify-client-secret
      # Allow Launcharr or another dashboard to embed Curatorr in an iframe.
      # Example: EMBED_ALLOWED_ORIGINS=http://localhost:3333
      # - EMBED_ALLOWED_ORIGINS=http://localhost:3333
      # Generate once: openssl rand -hex 32
      - SESSION_SECRET=replace-this-with-a-random-secret
      # Optional override. If omitted, Curatorr generates and stores a webhook key in config.
      - WEBHOOK_SECRET=replace-this-with-a-random-secret
      # optional but recommended if you only use HTTPS on domain:
      # - COOKIE_SECURE=true
      # - PUID=${PUID}
      # - PGID=${PGID}
      - TZ=${TZ:-UTC}
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./data/icons/custom:/app/public/icons/custom
    network_mode: bridge
    restart: unless-stopped

  curatorr_analyzer:
    profiles: ["analysis"]
    container_name: curatorr_analyzer
    depends_on:
      - curatorr
    image: mickygx/curatorr-analyzer:latest
    environment:
      - PORT=8765
    volumes:
      - ./data:/app/data
      # Mount your music library at the same path Plex reports in track file paths.
      # Example:
      # - /path/to/music:/media/music:ro
    # Uncomment and adjust to prevent the analyzer from monopolising CPU/memory.
    cpus: "1"      # max CPU cores (e.g. 1.5 = 150% of one core)
    mem_limit: 2g    # hard memory cap
    network_mode: "service:curatorr"
    restart: unless-stopped
